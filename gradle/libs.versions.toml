[versions]
kotlin = "2.4.10"
intellij-platform = "2.18.1"
junit = "6.1.2"
detekt = "2.0.0-alpha.5"
spotbugs-gradle = "6.5.1"
cpd = "3.5"
ktlint = "14.2.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-gradle" }
cpd = { id = "de.aaschmid.cpd", version.ref = "cpd" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-vintage = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
junit4 = { module = "junit:junit", version = "4.13.2" }
